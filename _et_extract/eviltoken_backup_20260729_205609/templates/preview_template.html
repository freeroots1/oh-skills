{% extends "base.html" %}
{% block content %}
<div class="container">
    <h1>Preview: {{ template.name }}</h1>
    <div class="card mt-4">
        <div class="card-header">
            <strong>Subject:</strong> {{ template.subject }}
        </div>
        <div class="card-body">
            <h5>Email Body:</h5>
            <div class="border p-3 bg-light">
                {{ template.body|safe }}
            </div>
        </div>
        <div class="card-footer">
            <small class="text-muted">Type: {{ template.type }}</small>
        </div>
    </div>
    <div class="mt-3">
        <a href="{{ url_for('edit_template', template_id=template.id) }}" class="btn btn-warning">Edit</a>
        <a href="{{ url_for('list_templates') }}" class="btn btn-primary">Back to Templates</a>
    </div>
</div>
{% endblock %}
