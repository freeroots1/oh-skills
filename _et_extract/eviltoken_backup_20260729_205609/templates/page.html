{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block page_title %}{{ title }}{% endblock %}
{% block content %}
<div class="glass">
    <div style="display: flex; justify-content: center; align-items: center; min-height: 200px; flex-direction: column; gap: 16px;">
        <i class="fas fa-{{ icon or 'cog' }}" style="font-size: 48px; color: var(--text-muted);"></i>
        <h3 style="font-weight: 400; color: var(--text-muted);">{{ message or 'Coming soon...' }}</h3>
        <p style="color: var(--text-muted);">This page is under construction.</p>
    </div>
</div>
{% endblock %}
