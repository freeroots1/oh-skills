{% extends "base.html" %}
{% block content %}
<div class="container">
    <h1>Edit Template: {{ template.name }}</h1>
    <form method="POST" class="mt-4">
        <div class="form-group">
            <label>Template Name</label>
            <input type="text" name="name" class="form-control" value="{{ template.name }}" required>
        </div>
        <div class="form-group">
            <label>Subject</label>
            <input type="text" name="subject" class="form-control" value="{{ template.subject }}" required>
        </div>
        <div class="form-group">
            <label>Body</label>
            <textarea name="body" class="form-control" rows="6" required>{{ template.body }}</textarea>
        </div>
        <div class="form-group">
            <label>Template Type</label>
            <select name="type" class="form-control">
                <option value="email" {% if template.type == 'email' %}selected{% endif %}>Email</option>
                <option value="sms" {% if template.type == 'sms' %}selected{% endif %}>SMS</option>
                <option value="phishing" {% if template.type == 'phishing' %}selected{% endif %}>Phishing</option>
            </select>
        </div>
        <button type="submit" class="btn btn-primary">Update Template</button>
        <a href="{{ url_for('list_templates') }}" class="btn btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}
